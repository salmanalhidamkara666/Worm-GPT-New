<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Chat - Worm AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #0f0f1e 100%);
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: rgba(20, 20, 40, 0.8);
      border-bottom: 1px solid rgba(100, 200, 255, 0.2);
      padding: 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      margin: 20px auto;
      width: 100%;
      gap: 20px;
      padding: 0 20px;
    }
    
    .chat-box {
      flex: 1;
      background: rgba(20, 20, 40, 0.6);
      border: 1px solid rgba(100, 200, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .message {
      display: flex;
      gap: 10px;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message.user {
      justify-content: flex-end;
    }
    
    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.4;
    }
    
    .message.user .message-content {
      background: linear-gradient(90deg, #00ff88, #00cc99);
      color: #000;
      border-bottom-right-radius: 4px;
    }
    
    .message.assistant .message-content {
      background: rgba(100, 150, 255, 0.2);
      border: 1px solid rgba(100, 150, 255, 0.4);
      border-bottom-left-radius: 4px;
    }
    
    .loading {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      background: rgba(100, 150, 255, 0.2);
      border-radius: 12px;
      width: fit-content;
    }
    
    .dot {
      width: 8px;
      height: 8px;
      background: #00ff88;
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    
    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.7;
      }
      50% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }
    
    .input-area {
      display: flex;
      gap: 10px;
      background: rgba(20, 20, 40, 0.6);
      border: 1px solid rgba(100, 200, 255, 0.2);
      border-radius: 12px;
      padding: 15px;
    }
    
    input {
      flex: 1;
      background: rgba(40, 40, 60, 0.8);
      border: none;
      color: #e0e0ff;
      padding: 10px 15px;
      border-radius: 8px;
      font-family: inherit;
      outline: none;
    }
    
    input::placeholder {
      color: #888;
    }
    
    input:focus {
      background: rgba(50, 50, 80, 0.8);
      border: 1px solid rgba(100, 200, 255, 0.4);
    }
    
    button {
      background: linear-gradient(90deg, #00ff88, #00cc99);
      border: none;
      color: #000;
      padding: 10px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Worm AI Chat Test</h1>
    <p>Test interface untuk Worm AI chatbot dengan Gemma Model</p>
  </div>
  
  <div class="container">
    <div class="chat-box" id="chatBox"></div>
    
    <div class="input-area">
      <input 
        type="text" 
        id="messageInput" 
        placeholder="Ketik pertanyaan Anda di sini..."
        autocomplete="off"
      >
      <button id="sendBtn" onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      
      // Disable input
      messageInput.disabled = true;
      sendBtn.disabled = true;
      
      // Add user message
      addMessage(text, 'user');
      messageInput.value = '';
      
      // Show loading
      const loadingEl = document.createElement('div');
      loadingEl.className = 'message loading';
      loadingEl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      chatBox.appendChild(loadingEl);
      chatBox.scrollTop = chatBox.scrollHeight;
      
      try {
        // Send to API
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              role: 'user',
              parts: [{ text }]
            }]
          })
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Tidak ada response';
        
        // Remove loading
        loadingEl.remove();
        
        // Add assistant message
        addMessage(reply, 'assistant');
        
      } catch (err) {
        loadingEl.remove();
        addMessage(`❌ Error: ${err.message}`, 'assistant');
      }
      
      // Enable input
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
    }
    
    function addMessage(text, role) {
      const msgEl = document.createElement('div');
      msgEl.className = `message ${role}`;
      
      const content = document.createElement('div');
      content.className = 'message-content';
      content.textContent = text;
      
      msgEl.appendChild(content);
      chatBox.appendChild(msgEl);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    // Allow Enter key
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    
    // Focus input on load
    messageInput.focus();
    
    // Initial message
    setTimeout(() => {
      addMessage('Halo! Selamat datang di Worm AI. Apa yang bisa saya bantu?', 'assistant');
    }, 500);
  </script>
</body>
</html>
